# Publishes the I.C.S.Y. forecast journal.
#
# Every run: collect fresh data -> record results of finished matches -> forecast new
# upcoming matches -> commit. Lines are only appended, never rewritten.
#
# The model code lives in a private repository and is checked out with a read-only
# fine-grained token (secret ICSY_CODE_TOKEN). The repository variable ICSY_CODE_REF can
# pin another branch or tag of the code.

name: Publish

on:
  schedule:
    - cron: "17 5 * * *"
    - cron: "17 17 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/publish.yml]

permissions:
  contents: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ICSY_DATA_DIR: ${{ github.workspace }}/data
      ICSY_CONTACT_EMAIL: ${{ vars.ICSY_CONTACT_EMAIL || 'https://github.com/hoxitoo/I.C.S.Y-predictions' }}
      JOURNAL: ${{ github.workspace }}/journal
    steps:
      - name: Check out the journal
        uses: actions/checkout@v4
        with:
          path: journal

      - name: Check out the model code
        uses: actions/checkout@v4
        with:
          repository: hoxitoo/I.C.S.Y-I-Can-See-You-
          ref: ${{ vars.ICSY_CODE_REF || 'claude/t-lite-publishing' }}
          token: ${{ secrets.ICSY_CODE_TOKEN }}
          path: code
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
          enable-cache: true
          cache-dependency-glob: code/uv.lock

      - name: Install
        working-directory: code
        run: uv sync --frozen --no-dev

      - name: Month for the VRS cache key
        id: month
        run: echo "value=$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"

      # Valve's repository (~300 MB) changes about once a month.
      - name: Restore VRS clone
        uses: actions/cache/restore@v4
        with:
          path: data/raw/vrs
          key: vrs-${{ steps.month.outputs.value }}
          restore-keys: vrs-

      # Liquipedia snapshots accumulate: results are collected from all of them.
      - name: Restore Liquipedia snapshots
        uses: actions/cache/restore@v4
        with:
          path: |
            data/raw/liquipedia
            data/silver/liquipedia/snapshots
          key: liquipedia-${{ github.run_id }}
          restore-keys: liquipedia-

      - name: Collect data
        working-directory: code
        run: |
          uv run --no-sync python -m icsy vrs sync
          uv run --no-sync python -m icsy vrs build
          uv run --no-sync python -m icsy scope build --top 70 > /dev/null
          uv run --no-sync python -m icsy liquipedia fetch

      - name: Save Liquipedia snapshots
        if: always()
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: |
            data/raw/liquipedia
            data/silver/liquipedia/snapshots
          key: liquipedia-${{ github.run_id }}

      - name: Save VRS clone
        uses: actions/cache/save@v4
        continue-on-error: true  # the key already exists after the first run of a month
        with:
          path: data/raw/vrs
          key: vrs-${{ steps.month.outputs.value }}

      - name: Forecast and settle
        working-directory: code
        run: |
          uv run --no-sync python -m icsy predict teams --journal "$JOURNAL" | tee forecast.log
          uv run --no-sync python -m icsy settle teams --journal "$JOURNAL" | tee settle.log
          {
            echo "### Forecasts"
            echo '```'
            cat forecast.log
            echo '```'
            echo "### Results and track record"
            echo '```'
            cat settle.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Commit and push
        working-directory: journal
        run: |
          code_sha=$(git -C "$GITHUB_WORKSPACE/code" rev-parse --short HEAD)
          for dir in predictions results; do
            if [ -d "$dir" ]; then git add "$dir"; fi
          done
          if git diff --cached --quiet; then
            echo "Nothing new to publish."
            exit 0
          fi
          added=$(git diff --cached --numstat | awk '{s += $1} END {print s}')
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -q -m "Journal: ${added} new lines, $(date -u +%Y-%m-%dT%H:%MZ)" \
            -m "Model code: hoxitoo/I.C.S.Y-I-Can-See-You-@${code_sha}"
          git push
